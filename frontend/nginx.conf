server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Browser talks to Prometheus through the frontend (no CORS, one port)
    location /api/ {
        proxy_pass http://prometheus:9090/api/;
        proxy_set_header Host $host;
    }
}
